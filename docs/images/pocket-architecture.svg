<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" role="img" aria-labelledby="title desc"><title id="title">Pocket account and trading architecture</title><desc id="desc">On the phone, a password manager passkey supplies a PRF output to Mera, which derives a wallet and an expiring signing session. Pocket reads AUSD wallet balances and signs Perpl orders on Monad. Collateral moves between the wallet and exchange; market data comes from the public Perpl API. No custody backend is shown.</desc><rect x="0" y="0" width="1400" height="510" rx="28" fill="#0F1115" stroke="#0F1115"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA0AA"/></marker></defs><text x="50" y="54" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#F5F3EC" text-anchor="start">One passkey. Your wallet. On-chain execution.</text><text x="50" y="85" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#9AA0AA" text-anchor="start">Pocket connects the pieces without a server holding your signing key.</text><rect x="50" y="115" width="725" height="310" rx="24" fill="#171A21" stroke="#2A2D35"/><text x="76" y="154" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#9AA0AA" text-anchor="start">ON YOUR PHONE</text><rect x="76" y="182" width="235" height="119" rx="20" fill="#0F1115" stroke="#2A2D35"/><text x="96" y="218" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#F5F3EC" text-anchor="start">Passkey</text><text x="96" y="249" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#9AA0AA" text-anchor="start">Face ID / fingerprint</text><text x="96" y="276" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#9AA0AA" text-anchor="start">Password manager</text><rect x="425" y="182" width="324" height="119" rx="20" fill="#0F1115" stroke="#2A2D35"/><text x="447" y="218" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#F5F3EC" text-anchor="start">Pocket + Mera</text><text x="447" y="249" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#9AA0AA" text-anchor="start">Derive your wallet</text><text x="447" y="276" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#9AA0AA" text-anchor="start">Sign with an expiring session</text><path d="M322 243 H413" stroke="#9AA0AA" stroke-width="2" marker-end="url(#arrow)"/><text x="368" y="226" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#9AA0AA" text-anchor="middle">PRF</text><text x="76" y="360" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#F5F3EC" text-anchor="start">Only public credential metadata is persisted.</text><text x="76" y="391" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#9AA0AA" text-anchor="start">Signing keys expire when the session ends.</text><rect x="948" y="115" width="402" height="310" rx="24" fill="#171A21" stroke="#2A2D35"/><text x="974" y="154" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#9AA0AA" text-anchor="start">MONAD · CHAIN 143</text><rect x="974" y="182" width="350" height="88" rx="18" fill="#0F1115" stroke="#2A2D35"/><text x="995" y="215" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#F5F3EC" text-anchor="start">AUSD wallet balance</text><text x="995" y="247" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#9AA0AA" text-anchor="start">Your dollars on Monad</text><rect x="974" y="322" width="350" height="78" rx="18" fill="#0F1115" stroke="#2A2D35"/><text x="995" y="353" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#F5F3EC" text-anchor="start">Perpl exchange</text><text x="995" y="382" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#9AA0AA" text-anchor="start">Trading collateral + positions</text><path d="M775 208 H931" stroke="#9AA0AA" stroke-width="2" marker-end="url(#arrow)"/><text x="853" y="195" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#9AA0AA" text-anchor="middle">Read balances</text><path d="M775 350 H931" stroke="#9AA0AA" stroke-width="2" marker-end="url(#arrow)"/><text x="853" y="334" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#2FE39A" text-anchor="middle">Signed orders</text><path d="M1285 278 V313" stroke="#9AA0AA" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1259" y="300" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA0AA" text-anchor="end">Collateral in / out</text><text x="50" y="470" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#2FE39A" text-anchor="start">MARKET DATA</text><text x="191" y="470" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#9AA0AA" text-anchor="start">Live prices and candles come directly from Perpl’s public API.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="635" viewBox="0 0 1400 635" role="img" aria-labelledby="title desc"><title id="title">Pocket trading walkthrough</title><desc id="desc">Three illustrated demo screens: choose Bitcoin Up or Down, select a five-dollar risk budget at five-times leverage, and track a simulated trade with its auto-close price and close button. At a hypothetical $100,000 entry and 4% maintenance margin, estimated auto-close is $84,000. This is an illustration, not an app screenshot.</desc><rect x="0" y="0" width="1400" height="635" rx="28" fill="#0F1115" stroke="#0F1115"/><text x="50" y="54" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#F5F3EC" text-anchor="start">A trade you can understand before you place it.</text><text x="50" y="85" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#9AA0AA" text-anchor="start">ILLUSTRATED DEMO  /  Hypothetical prices, real risk-sizing logic</text><rect x="50" y="115" width="350" height="440" rx="32" fill="#0F1115" stroke="#2A2D35"/><rect x="177" y="128" width="96" height="6" rx="3" fill="#2A2D35" stroke="#2A2D35"/><text x="74" y="173" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#F5F3EC" text-anchor="start">01  Choose a direction</text><text x="74" y="201" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA0AA" text-anchor="start">Bitcoin · Up or Down</text><rect x="525" y="115" width="350" height="440" rx="32" fill="#0F1115" stroke="#2A2D35"/><rect x="652" y="128" width="96" height="6" rx="3" fill="#2A2D35" stroke="#2A2D35"/><text x="549" y="173" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#F5F3EC" text-anchor="start">02  Set your risk</text><text x="549" y="201" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA0AA" text-anchor="start">Dollars first. Then choose how bold.</text><rect x="1000" y="115" width="350" height="440" rx="32" fill="#0F1115" stroke="#2A2D35"/><rect x="1127" y="128" width="96" height="6" rx="3" fill="#2A2D35" stroke="#2A2D35"/><text x="1024" y="173" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#F5F3EC" text-anchor="start">03  Follow the trade</text><text x="1024" y="201" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA0AA" text-anchor="start">P&amp;L, auto-close, and a clear exit.</text><text x="78" y="249" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#9AA0AA" text-anchor="start">BTC</text><text x="78" y="287" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#F5F3EC" text-anchor="start">$100,000</text><text x="78" y="315" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA0AA" text-anchor="start">Example entry price</text><path d="M78 394 C106 394 104 349 128 362 S166 397 190 374 S220 332 246 347 S278 366 298 337 S329 355 365 320" fill="none" stroke="#2FE39A" stroke-width="4" stroke-linecap="round"/><path d="M78 414 L373 414" fill="none" stroke="#2A2D35" stroke-width="2"/><rect x="78" y="455" width="140" height="56" rx="28" fill="#2FE39A" stroke="#2FE39A"/><text x="148" y="490" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1115" text-anchor="middle">↑  Up</text><rect x="232" y="455" width="140" height="56" rx="28" fill="#171A21" stroke="#2A2D35"/><text x="302" y="490" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#FF5A5F" text-anchor="middle">↓  Down</text><text x="549" y="239" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F3EC" text-anchor="start">How much are you willing to risk?</text><rect x="549" y="257" width="88" height="44" rx="16" fill="#2FE39A" stroke="#2FE39A"/><text x="593" y="285" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1115" text-anchor="middle">$5</text><rect x="646" y="257" width="88" height="44" rx="16" fill="#171A21" stroke="#2A2D35"/><text x="690" y="285" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#9AA0AA" text-anchor="middle">$10</text><rect x="743" y="257" width="88" height="44" rx="16" fill="#171A21" stroke="#2A2D35"/><text x="787" y="285" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#9AA0AA" text-anchor="middle">$25</text><text x="549" y="331" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F3EC" text-anchor="start">How bold?</text><rect x="549" y="348" width="88" height="39" rx="14" fill="#171A21" stroke="#2A2D35"/><text x="593" y="373" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#9AA0AA" text-anchor="middle">Calm 2×</text><rect x="646" y="348" width="88" height="39" rx="14" fill="#171A21" stroke="#2FE39A"/><text x="690" y="373" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#2FE39A" text-anchor="middle">Bold 5×</text><rect x="743" y="348" width="88" height="39" rx="14" fill="#171A21" stroke="#2A2D35"/><text x="787" y="373" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#9AA0AA" text-anchor="middle">Wild 10×</text><rect x="549" y="405" width="302" height="70" rx="14" fill="#171A21" stroke="#2A2D35"/><text x="563" y="431" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F5F3EC" text-anchor="start">If BTC falls to $84,000,</text><text x="563" y="455" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F5F3EC" text-anchor="start">this trade auto-closes.</text><rect x="549" y="491" width="302" height="43" rx="22" fill="#2FE39A" stroke="#2FE39A"/><text x="700" y="519" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F1115" text-anchor="middle">Hold to trade</text><text x="1024" y="244" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#9AA0AA" text-anchor="start">BTC Up · Bold 5×</text><text x="1024" y="293" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#2FE39A" text-anchor="start">+$0.84</text><text x="1024" y="324" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#9AA0AA" text-anchor="start">+16.8% on your $5 risk budget</text><rect x="1024" y="352" width="302" height="111" rx="18" fill="#171A21" stroke="#2A2D35"/><text x="1040" y="380" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F5F3EC" text-anchor="start">Auto-close at $84,000</text><rect x="1040" y="398" width="270" height="9" rx="4" fill="#2A2D35" stroke="#2A2D35"/><rect x="1040" y="398" width="270" height="9" rx="4" fill="#2FE39A" stroke="#2FE39A"/><text x="1040" y="438" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#2FE39A" text-anchor="start">● Safe</text><text x="1310" y="438" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#9AA0AA" text-anchor="end">Now $103,360</text><rect x="1024" y="487" width="302" height="47" rx="24" fill="#171A21" stroke="#2A2D35"/><text x="1175" y="517" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#F5F3EC" text-anchor="middle">Close trade</text><text x="443" y="347" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="400" fill="#9AA0AA" text-anchor="middle">→</text><text x="918" y="347" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="400" fill="#9AA0AA" text-anchor="middle">→</text><text x="50" y="597" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#9AA0AA" text-anchor="start">Example: $5 risk × 5 = $25 exposure · 4% maintenance margin · fees shown separately.</text></svg>
